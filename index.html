<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tradevithika — India's B2B Textiles & Apparel Export Marketplace</title>
    <meta name="description" content="Tradevithika connects verified Indian textiles and apparel manufacturers with global buyers. Source fabrics, garments, and home textiles with trust and transparency." />
    <meta name="author" content="Tradevithika" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <meta property="og:title" content="Tradevithika — India's B2B Textiles & Apparel Marketplace" />
    <meta property="og:description" content="Verified Indian textiles & apparel suppliers connecting with global buyers." />
    <meta property="og:url" content="https://indimart-global.lovable.app/" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Tradevithika",
        "url": "https://indimart-global.lovable.app/",
        "description": "India's B2B textiles and apparel export marketplace connecting verified manufacturers with global buyers."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Tradevithika",
        "url": "https://indimart-global.lovable.app/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://indimart-global.lovable.app/products?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
